name: jarvis
description: JARVIS Voice Assistant — Termux-power feature set, native Android app
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.1
  url_launcher: ^6.2.5
  package_info_plus: ^6.0.0
  connectivity_plus: ^5.0.2

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Device control (replaces the Termux:API calls from the Termux version)
  battery_plus: ^6.0.1
  screen_brightness: ^1.0.1
  flutter_volume_controller: ^1.3.2
  android_intent_plus: ^5.0.2
  vibration: ^2.0.0

  # Notifications (persistent notification while listening, plus alerts)
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
